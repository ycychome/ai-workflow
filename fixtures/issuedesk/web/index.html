<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{.Title}}</title><link rel="stylesheet" href="/static/app.css"><script src="/static/app.js" defer></script></head>
<body><main><h1>{{.Title}}</h1><p>多租户合成工单演示。身份凭证只保存在当前页面内存中，刷新后清除。</p>
<form id="login"><label>身份凭证 <input id="token" type="password" autocomplete="off" required></label><button>进入工作台</button></form><p id="identity"></p><p id="notice" role="status"></p>
<section id="workspace" hidden><h2>创建工单</h2><form id="create"><label>标题 <input id="title" maxlength="200" required></label><label>正文 <textarea id="body" maxlength="20000"></textarea></label><button>创建</button></form>
<h2>工单列表</h2><form id="filter"><label>搜索 <input id="query"></label><label>状态 <select id="status"><option value="">全部</option><option value="open">待处理</option><option value="in_progress">处理中</option><option value="resolved">已解决</option><option value="closed">已关闭</option><option value="cancelled">已取消</option></select></label><button>查询</button></form><div id="tickets"></div><button id="more" hidden>下一页</button>
<section id="detail" hidden><h2 id="ticket-title"></h2><p id="ticket-body"></p><p id="ticket-meta"></p><form id="edit"><label>标题 <input id="edit-title" maxlength="200" required></label><label>正文 <textarea id="edit-body"></textarea></label><label>状态 <select id="edit-status"><option value="open">待处理</option><option value="in_progress">处理中</option><option value="resolved">已解决</option><option value="closed">已关闭</option><option value="cancelled">已取消</option></select></label><label>分派人员编号 <input id="assignee" type="number" min="1"></label><button>保存</button></form><h3>评论</h3><div id="comments"></div><form id="comment"><label>评论内容 <textarea id="comment-body" required maxlength="10000"></textarea></label><button>发送评论</button></form><button id="delete" hidden>删除工单</button></section></section></main></body></html>
