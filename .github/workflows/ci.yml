name: M0 verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: m0
          POSTGRES_PASSWORD: m0
          POSTGRES_DB: m0
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U m0"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version-file: go.mod
      - run: docker pull alpine@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
      - run: docker pull python@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a
      - run: python3 -m unittest -v
        working-directory: fixtures/repository
      - run: make test-integration && make build && go vet ./...
        env:
          M0_TEST_DATABASE_URL: postgres://m0:m0@127.0.0.1:55432/m0?sslmode=disable
          M0_TEST_DOCKER: docker
